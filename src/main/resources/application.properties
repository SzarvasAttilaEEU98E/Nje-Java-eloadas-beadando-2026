spring.application.name=java-eloadas

# OANDA Practice REST API
oanda.api.url=https://api-fxpractice.oanda.com
oanda.api.token=${OANDA_API_TOKEN}

# OANDA gyakorló számla azonosítója
oanda.account.id=${OANDA_ACCOUNT_ID}

spring.datasource.url=jdbc:h2:file:C:/data/mozi
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 webes konzol
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console